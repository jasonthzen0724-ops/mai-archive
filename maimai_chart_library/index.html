<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAI ARCHIVE｜自製譜面庫</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #0b0f17; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 30px 20px; }
    header { max-width: 1000px; margin: 0 auto 30px; border-bottom: 1px solid rgba(0, 240, 255, 0.2); padding-bottom: 20px; }
    h1 { color: #00f0ff; margin: 0 0 10px; font-size: 28px; letter-spacing: 1px; }
    p.subtitle { color: #8995a6; margin: 0; font-size: 14px; }
    main { max-width: 1000px; margin: 0 auto; }
    
    /* 關鍵：強制顯示的卡片網格 */
    .chart-grid {
      display: grid !important;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    /* Modal 彈窗樣式 */
    .modal-backdrop {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex; justify-content: center; align-items: center;
      z-index: 99999;
    }
    .modal-content {
      background: #151e2a; padding: 24px; border-radius: 12px;
      max-width: 600px; width: 90%; color: #fff; border: 1px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }
  </style>
</head>
<body>

  <header>
    <h1>M MAI ARCHIVE</h1>
    <p class="subtitle">自製譜面資料庫 (收錄譜面: <span id="result-count">01</span> / <span id="stat-total">01</span>)</p>
  </header>

  <main>
    <!-- 卡片容器 -->
    <div id="chart-grid" class="chart-grid"></div>
    <div id="empty-state" hidden style="text-align: center; padding: 40px; color: #888;">查無符合條件的譜面</div>
  </main>

  <!-- 影片預覽 Modal 彈窗 -->
  <div id="detail-modal" class="modal-backdrop" hidden>
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 id="modal-title" style="margin: 0; font-size: 20px; color: #00f0ff;">-</h2>
        <button id="modal-close" style="background: transparent; border: none; color: #fff; font-size: 24px; cursor: pointer;">&times;</button>
      </div>
      <p id="modal-artist" style="color: #8995a6; margin-bottom: 15px;">-</p>
      
      <!-- YouTube 影片播放區 -->
      <div id="modal-cover" style="margin-bottom: 15px; text-align: center;"></div>
      <div id="modal-meta" style="margin-bottom: 20px;"></div>
      
      <a id="download-link" href="#" download style="display: block; text-align: center; padding: 12px; background: #00f0ff; color: #000; text-decoration: none; border-radius: 6px; font-weight: bold;">下載 ZIP 譜面包</a>
    </div>
  </div>

  <!-- 引入 app.js -->
  <script src="assets/js/app.js"></script>
</body>
</html>
