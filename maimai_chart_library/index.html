<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAI ARCHIVE｜自製譜面庫</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #0b0f17; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 30px 20px; }
    
    header { max-width: 1000px; margin: 0 auto 25px; border-bottom: 1px solid rgba(0, 240, 255, 0.2); padding-bottom: 20px; }
    h1 { color: #00f0ff; margin: 0 0 8px; font-size: 28px; letter-spacing: 1px; }
    p.subtitle { color: #8995a6; margin: 0; font-size: 14px; }

    /* 搜尋與篩選列 */
    .filter-bar {
      max-width: 1000px; margin: 0 auto 25px; display: flex; gap: 12px; flex-wrap: wrap;
    }
    .search-input, .select-input {
      background: #151e2a; border: 1px solid rgba(0, 240, 255, 0.3); color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 14px;
    }
    .search-input { flex: 1; min-width: 200px; }
    .search-input:focus, .select-input:focus { outline: none; border-color: #00f0ff; }

    /* 譜面卡片網格 */
    .chart-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
    }
    .chart-card {
      background: #151e2a; border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 12px; overflow: hidden;
      cursor: pointer; transition: transform 0.2s, border-color 0.2s;
    }
    .chart-card:hover { transform: translateY(-4px); border-color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }

    /* 詳細資訊新頁面 */
    .detail-page {
      max-width: 800px; margin: 0 auto; background: #151e2a; border: 1px solid #00f0ff; border-radius: 12px; padding: 30px; box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
    }
    .back-btn {
      display: inline-block; background: transparent; border: 1px solid #8995a6; color: #8995a6; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-bottom: 20px; text-decoration: none; font-size: 14px;
    }
    .back-btn:hover { color: #fff; border-color: #fff; }
    
    .btn-group { display: flex; gap: 15px; margin-top: 25px; flex-wrap: wrap; }
    .action-btn {
      flex: 1; min-width: 200px; text-align: center; padding: 14px 20px; border-radius: 8px; font-weight: bold; text-decoration: none; cursor: pointer; font-size: 15px; transition: 0.2s;
    }
    .btn-watch { background: rgba(0, 240, 255, 0.15); color: #00f0ff; border: 1px solid #00f0ff; }
    .btn-watch:hover { background: #00f0ff; color: #000; }
    .btn-download { background: #bb73ff; color: #fff; border: 1px solid #bb73ff; }
    .btn-download:hover { background: #9d4edd; }
  </style>
</head>
<body>

  <!-- 主頁面：列表檢視 -->
  <div id="home-view">
    <header>
      <h1>M MAI ARCHIVE</h1>
      <p class="subtitle">自製譜面資料庫 (收錄譜面: <span id="result-count">01</span> / <span id="stat-total">01</span>)</p>
    </header>

    <main style="max-width: 1000px; margin: 0 auto;">
      <!-- 搜尋與篩選器 -->
      <div class="filter-bar">
        <input type="text" id="search-input" class="search-input" placeholder="搜尋曲名、曲師或譜師...">
        <select id="diff-select" class="select-input">
          <option value="ALL">全部難度</option>
          <option value="Master">Master</option>
          <option value="Re:Master">Re:Master</option>
          <option value="Expert">Expert</option>
        </select>
      </div>

      <div id="chart-grid" class="chart-grid"></div>
      <div id="empty-state" hidden style="text-align: center; padding: 40px; color: #888;">查無符合條件的譜面</div>
    </main>
  </div>

  <!-- 獨立頁面：譜面詳細資訊檢視 -->
  <div id="detail-view" style="display: none;">
    <div class="detail-page">
      <button class="back-btn" onclick="showHome()">← 返回譜面列表</button>
      
      <div id="detail-cover-container" style="height: 240px; border-radius: 8px; background-size: cover; background-position: center; margin-bottom: 20px; position: relative;">
        <span id="detail-badge" style="position: absolute; top: 15px; right: 15px; padding: 6px 12px; border-radius: 4px; font-weight: bold; background: #bb73ff; color: #fff; font-size: 14px;"></span>
      </div>

      <h1 id="detail-title" style="margin: 0 0 8px; color: #00f0ff;">-</h1>
      <p id="detail-artist" style="color: #8995a6; font-size: 16px; margin: 0 0 20px;">-</p>

      <div style="background: rgba(255,255,255,0.05); padding: 15px 20px; border-radius: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; color: #ccc;">
        <div>BPM：<span id="detail-bpm" style="color: #fff;">-</span></div>
        <div>譜師名義：<span id="detail-designer" style="color: #fff;">-</span></div>
        <div>難度分類：<span id="detail-diff" style="color: #fff;">-</span></div>
        <div>等級：<span id="detail-level" style="color: #fff;">-</span></div>
      </div>

      <!-- 嵌入可預覽影片容器 (預設隱藏，點擊按鈕開關) -->
      <div id="video-embed-container" style="margin-top: 20px; display: none;">
        <iframe id="video-iframe" style="width: 100%; height: 360px; border: 0; border-radius: 8px;" allowfullscreen></iframe>
      </div>

      <!-- 兩大關鍵點擊按鈕 -->
      <div class="btn-group">
        <a id="watch-video-btn" href="javascript:void(0)" onclick="toggleVideoEmbed()" class="action-btn btn-watch">▶ 觀看完整影片</a>
        <a id="download-zip-btn" href="#" download class="action-btn btn-download">⬇ 下載整個 ZIP 譜面包</a>
      </div>
    </div>
  </div>

<script>
  const charts = [
    // 1. 第一首：Melodiniq
    {
      id: "melodiniq",
      title: "Melodiniq",
      artist: "onoken a.k.a. owl＊tree",
      designer: "譜師名義",
      bpm: 185,
      difficulty: "Master",
      level: "14+",
      folder: "chart/melodiniq/",
      youtubeUrl: "https://www.youtube.com/embed/-ETn7R8KcjA",
      zipName: "melodiniq.zip"
    },
    // 2. 第二首：SPOOKY BADBALL
    {
      id: "spooky_badball",
      title: "SPOOKY BADBALL",
      artist: "曲師名稱",                  // 請替換為這首歌的曲師名稱
      designer: "譜師名義",                // 請替換為譜師名稱
      bpm: 190,                           // 請替換為正確的 BPM
      difficulty: "Master",               // 難度分類 (Master / Re:Master / Expert)
      level: "14",                        // 等級 (例如 14, 14+, 13)
      folder: "chart/SPOOKY BADBALL/",    // 對應你的資料夾名稱
      youtubeUrl: "https://www.youtube.com/embed/你的YouTube影片ID", // 請填入對應的影片內嵌網址
      zipName: "SPOOKY BADBALL.zip"      // 放在該資料夾內的 ZIP 檔名
    }
  ];

  let currentChart = null;

  function renderCharts() {
    const chartGrid = document.getElementById("chart-grid");
    const searchInput = document.getElementById("search-input")?.value.toLowerCase() || "";
    const diffSelect = document.getElementById("diff-select")?.value || "ALL";
    const resultCount = document.getElementById("result-count");
    const statTotal = document.getElementById("stat-total");
    const emptyState = document.getElementById("empty-state");

    if (!chartGrid) return;
    chartGrid.innerHTML = "";

    const filtered = charts.filter(chart => {
      const matchesSearch = chart.title.toLowerCase().includes(searchInput) ||
                            chart.artist.toLowerCase().includes(searchInput) ||
                            chart.designer.toLowerCase().includes(searchInput);
      const matchesDiff = (diffSelect === "ALL") || (chart.difficulty.toLowerCase() === diffSelect.toLowerCase());
      return matchesSearch && matchesDiff;
    });

    if (resultCount) resultCount.textContent = String(filtered.length).padStart(2, '0');
    if (statTotal) statTotal.textContent = String(charts.length).padStart(2, '0');

    if (filtered.length === 0) {
      if (emptyState) emptyState.hidden = false;
      return;
    }
    if (emptyState) emptyState.hidden = true;

    filtered.forEach(chart => {
      const baseFolder = chart.folder.endsWith("/") ? chart.folder : `${chart.folder}/`;
      const coverPath = `${baseFolder}bg.png`;

      const card = document.createElement("article");
      card.className = "chart-card";
      card.onclick = () => showDetail(chart.id);

      card.innerHTML = `
        <div style="height: 160px; background-image: url('${coverPath}'), linear-gradient(135deg, #00f0ff33, #111721); background-size: cover; background-position: center; position: relative;">
          <span style="position: absolute; top: 10px; right: 10px; padding: 4px 8px; border-radius: 4px; font-weight: bold; background: #bb73ff; color: #fff; font-size: 12px;">
            ${chart.difficulty.toUpperCase()} ${chart.level}
          </span>
        </div>
        <div style="padding: 16px;">
          <h3 style="margin: 0 0 5px; font-size: 18px; color: #fff;">${chart.title}</h3>
          <p style="margin: 0 0 12px; font-size: 13px; color: #8995a6;">${chart.artist}</p>
          <div style="display: flex; justify-content: space-between; font-size: 12px; color: #8592a3; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
            <span>BPM: ${chart.bpm}</span>
            <span>譜師: ${chart.designer}</span>
          </div>
        </div>
      `;
      chartGrid.appendChild(card);
    });
  }

  function showDetail(id) {
    const chart = charts.find(c => c.id === id);
    if (!chart) return;
    currentChart = chart;

    const baseFolder = chart.folder.endsWith("/") ? chart.folder : `${chart.folder}/`;
    const coverPath = `${baseFolder}bg.png`;
    const zipPath = `${baseFolder}${chart.zipName}`;

    document.getElementById("detail-title").textContent = chart.title;
    document.getElementById("detail-artist").textContent = chart.artist;
    document.getElementById("detail-bpm").textContent = chart.bpm;
    document.getElementById("detail-designer").textContent = chart.designer;
    document.getElementById("detail-diff").textContent = chart.difficulty;
    document.getElementById("detail-level").textContent = chart.level;
    
    document.getElementById("detail-badge").textContent = `${chart.difficulty.toUpperCase()} ${chart.level}`;
    document.getElementById("detail-cover-container").style.backgroundImage = `url('${coverPath}'), linear-gradient(135deg, #00f0ff33, #111721)`;
    
    const downloadBtn = document.getElementById("download-zip-btn");
    downloadBtn.href = zipPath;
    downloadBtn.setAttribute("download", chart.zipName);

    const videoContainer = document.getElementById("video-embed-container");
    const videoIframe = document.getElementById("video-iframe");
    videoContainer.style.display = "none";
    videoIframe.src = "";

    document.getElementById("home-view").style.display = "none";
    document.getElementById("detail-view").style.display = "block";
    window.scrollTo(0, 0);
  }

  function showHome() {
    document.getElementById("detail-view").style.display = "none";
    document.getElementById("home-view").style.display = "block";
    const videoIframe = document.getElementById("video-iframe");
    if (videoIframe) videoIframe.src = "";
  }

  function toggleVideoEmbed() {
    if (!currentChart) return;
    const videoContainer = document.getElementById("video-embed-container");
    const videoIframe = document.getElementById("video-iframe");

    if (videoContainer.style.display === "none") {
      videoIframe.src = `${currentChart.youtubeUrl}?autoplay=1`;
      videoContainer.style.display = "block";
    } else {
      videoContainer.style.display = "none";
      videoIframe.src = "";
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("search-input")?.addEventListener("input", renderCharts);
    document.getElementById("diff-select")?.addEventListener("change", renderCharts);
    renderCharts();
  });
</script>
</body>
</html>
