<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAI ARCHIVE｜自製譜面庫</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* 補強備用樣式 */
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999;
    }
    .modal-content {
      background: #151e2a; padding: 20px; border-radius: 12px;
      max-width: 600px; width: 90%; color: #fff; border: 1px solid #00f0ff;
    }
  </style>
</head>
<body style="background: #0b0f17; color: #fff; font-family: sans-serif; padding: 20px;">

  <header style="max-width: 1000px; margin: 0 auto 30px;">
    <h1 style="color: #00f0ff; margin-bottom: 5px;">M MAI ARCHIVE</h1>
    <p style="color: #8995a6; margin: 0;">自製譜面資料庫 (收錄譜面: <span id="result-count">01</span> / <span id="stat-total">01</span>)</p>
  </header>

  <main style="max-width: 1000px; margin: 0 auto;">
    <!-- 卡片渲染容器 (關鍵!) -->
    <div id="chart-grid" class="chart-grid"></div>
    <div id="empty-state" hidden style="text-align: center; padding: 40px; color: #888;">查無符合條件的譜面</div>
  </main>

  <!-- 詳情與影片彈窗 Modal -->
  <div id="detail-modal" class="modal-backdrop" hidden>
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 id="modal-title" style="margin: 0; font-size: 20px; color: #00f0ff;">-</h2>
        <button id="modal-close" style="background: transparent; border: none; color: #fff; font-size: 24px; cursor: pointer;">&times;</button>
      </div>
      <p id="modal-artist" style="color: #8995a6; margin-bottom: 15px;">-</p>
      
      <div id="modal-cover" style="margin-bottom: 15px; text-align: center;"></div>
      <div id="modal-meta" style="margin-bottom: 20px;"></div>
      
      <a id="download-link" href="#" download style="display: block; text-align: center; padding: 12px; background: #00f0ff; color: #000; text-decoration: none; border-radius: 6px; font-weight: bold;">下載 ZIP 譜面包</a>
    </div>
  </div>

  <!-- 正確引入 app.js (修正檔名問題) -->
  <script src="assets/js/app.js"></script>
</body>
</html>
